[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
gas_reports = ["*"]

solc_version='0.8.27'
evm_version='Cancun'
optimizer = true
optimizer-runs = 200
via_ir = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
localhost = "${LOCALHOST_RPC_URL}"
goatMainnet = "https://rpc.goat.network"
goatTestnet = "https://rpc.testnet3.goat.network"
bscTestnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
sepolia = { key = "${SEPOLIA_ETHERSCAN_API_KEY}" }
bscTestnet = { key = "${BSC_ETHERSCAN_API_KEY}" }